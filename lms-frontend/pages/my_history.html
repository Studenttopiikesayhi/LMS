<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ประวัติและคืนหนังสือ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
</head>
<body>
<div id="navbar"></div>
<div class="container">
    <div id="alertBox"></div>

    <div class="card shadow-sm mb-4">
        <div class="card-header bg-warning text-dark"><h5 class="mb-0">↩️ หนังสือที่ต้องคืน</h5></div>
        <div class="card-body" id="currentBox"></div>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-info text-white"><h5 class="mb-0">📜 ประวัติการจองและเช่าหนังสือ</h5></div>
        <div class="table-responsive">
            <table class="table table-hover table-striped align-middle mb-0">
                <thead class="table-dark"><tr><th style="width:70px">ปก</th><th>หนังสือ</th><th>วันที่ทำรายการ</th><th>กำหนดส่ง</th><th>วันที่คืน</th><th>ค่าเช่า</th><th>ค่าปรับ</th><th>หมายเหตุ</th><th>สถานะ</th></tr></thead>
                <tbody id="histRows"></tbody>
            </table>
        </div>
    </div>
    <div class="mt-3"><a href="dashboard.html" class="btn btn-secondary">⬅️ กลับหน้าหลัก</a></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        if (!requireLogin()) return;
        renderNavbar(); showFlash();
        loadCurrent(); loadHistory();
    });
    async function loadCurrent() {
        const box = document.getElementById('currentBox');
        const { data } = await apiFetch('/issues.php?action=my_current');
        if (!data.success || !data.data.length) { box.innerHTML = '<div class="alert alert-success mb-0">คุณไม่มีหนังสือที่ต้องคืนในขณะนี้ 🎉</div>'; return; }
        const today = new Date().toISOString().slice(0, 10);
        box.innerHTML = '<ul class="list-group">' + data.data.map(i => {
            const late = i.due_date < today ? ' <span class="badge bg-danger">เกินกำหนด</span>' : '';
            const note = i.description ? `<div class="small text-muted">หมายเหตุ: ${escapeHtml(i.description)}</div>` : '';
            return `<li class="list-group-item d-flex justify-content-between align-items-center">
        <span class="d-flex align-items-center gap-2">
          ${coverImg(i.cover_url, i.title, 48)}
          <span>${escapeHtml(i.title)} <small class="text-muted">(กำหนดส่ง ${fmtDate(i.due_date)})</small>${late}
            <div class="small text-muted">ค่าเช่าที่เรียกเก็บ ${fmtMoney(i.amount)} บ.</div>${note}</span>
        </span>
        <button class="btn btn-sm btn-warning" onclick="doReturn(${i.id})">คืนหนังสือ</button></li>`;
        }).join('') + '</ul><div class="form-text mt-2">*หากคืนเกินกำหนด มีค่าปรับวันละ 10 บาท</div>';
    }
    async function doReturn(id) {
        if (!confirm('ยืนยันคืนหนังสือเล่มนี้?')) return;
        const { status, data } = await apiFetch('/issues.php?action=return', { method: 'POST', body: { issue_id: id } });
        if (status === 200 && data.success) { setFlash('success', data.message); location.reload(); }
        else showAlert(data.message || 'คืนไม่สำเร็จ', 'danger');
    }
    async function loadHistory() {
        const tbody = document.getElementById('histRows');
        const { data } = await apiFetch('/issues.php?action=history');
        if (!data.success || !data.data.length) { tbody.innerHTML = '<tr><td colspan="9" class="text-center text-muted py-3">ยังไม่มีประวัติ</td></tr>'; return; }
        tbody.innerHTML = data.data.map(r => {
            /* ใช้ค่าเช่าที่บันทึกไว้จริงในฟิลด์ amount (ไม่คำนวณจากราคาปกปัจจุบัน)
               -> ถ้าราคาปกถูกแก้ภายหลัง ยอดในประวัติจะไม่เปลี่ยนตาม
               fallback ไปคำนวณจากราคาปก เฉพาะรายการเก่าที่ยังไม่มี amount */
            const fee = (Number(r.amount) > 0) ? Number(r.amount) : Number(r.price) * 0.10;
            return `<tr>
      <td>${coverImg(r.cover_url, r.title)}</td>
      <td>${escapeHtml(r.title)}</td><td>${fmtDate(r.issue_date)}</td><td>${fmtDate(r.due_date)}</td>
      <td>${r.return_date ? fmtDate(r.return_date) : '-'}</td><td>${fmtMoney(fee)} บ.</td>
      <td class="text-danger fw-bold">${Number(r.fine) > 0 ? fmtMoney(r.fine) + ' บ.' : '-'}</td>
      <td><small>${r.description ? escapeHtml(r.description) : '-'}</small></td>
      <td>${statusBadge(r)}</td></tr>`;
        }).join('');
    }
</script>
</body>
</html>
