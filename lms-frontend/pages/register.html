<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สมัครสมาชิก - ร้านเช่าหนังสือ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
</head>
<body>
<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-5">
            <div id="alertBox"></div>
            <div class="card shadow-sm">
                <div class="card-header bg-success text-white py-3"><h4 class="mb-0">สมัครสมาชิก</h4></div>
                <div class="card-body p-4">
                    <div class="mb-3"><label class="form-label">ชื่อ-นามสกุล</label><input type="text" id="name" class="form-control"></div>
                    <div class="mb-3"><label class="form-label">อีเมล</label><input type="email" id="email" class="form-control"></div>
                    <div class="mb-3"><label class="form-label">รหัสผ่าน</label><input type="password" id="password" class="form-control"></div>
                    <button class="btn btn-success w-100" onclick="doRegister()">ยืนยันการสมัคร</button>
                    <a href="login.html" class="btn btn-link w-100 mt-2 text-decoration-none">กลับหน้าเข้าสู่ระบบ</a>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
</body>
</html>
