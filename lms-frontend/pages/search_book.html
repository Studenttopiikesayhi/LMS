<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ค้นหาหนังสือ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
</head>
<body>
<div id="navbar"></div>
<div class="container">
    <div id="alertBox"></div>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0">ค้นหาหนังสือ</h2>
        <a href="login.html" id="guestHint" class="btn btn-sm btn-warning">เข้าสู่ระบบเพื่อเช่าหนังสือ</a>
    </div>
    <form id="searchForm" class="d-flex mb-4 shadow-sm">
        <input type="text" id="q" class="form-control me-2" placeholder="พิมพ์ชื่อหนังสือ ผู้แต่ง หรือหมวดหมู่...">
        <button type="submit" class="btn btn-primary px-4">ค้นหา</button>
    </form>
    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-striped table-hover align-middle mb-0">
                <thead class="table-dark"><tr><th style="width:70px">ปก</th><th>ชื่อหนังสือ</th><th>ผู้เขียน</th><th>หมวดหมู่</th><th>ราคา</th><th>สถานะ</th><th>จอง</th></tr></thead>
                <tbody id="bookRows"></tbody>
            </table>
        </div>
    </div>
    <div class="mt-3"><a href="dashboard.html" class="btn btn-secondary">⬅️ กลับหน้าหลัก</a></div>
</div>

<!-- กล่องยืนยันการจอง -->
<div class="modal fade" id="reserveModal" tabindex="-1">
    <div class="modal-dialog"><div class="modal-content">
        <div class="modal-header"><h5 class="modal-title">ยืนยันการจองหนังสือ</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
            <input type="hidden" id="rv_book_id">
            <div class="d-flex gap-3 mb-3">
                <div id="rv_cover"></div>
                <div>
                    <div class="fw-bold" id="rv_title"></div>
                    <div class="text-muted small">ผู้เขียน: <span id="rv_author"></span></div>
                    <div class="mt-2">ค่าเช่า <span class="badge bg-primary fs-6"><span id="rv_fee">0.00</span> บาท</span></div>
                    <div class="form-text">ชำระที่เคาน์เตอร์เมื่อมารับหนังสือ · กำหนดส่งคืน 7 วัน</div>
                </div>
            </div>
            <div>
                <label class="form-label">หมายเหตุ <small class="text-muted">(ไม่บังคับ)</small></label>
                <input id="rv_note" class="form-control" maxlength="255" placeholder="เช่น ขอรับวันเสาร์ / ชำระเงินสด">
                <div class="form-text">ยาวไม่เกิน 255 ตัวอักษร</div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" data-bs-dismiss="modal">ยกเลิก</button>
            <button class="btn btn-success" onclick="confirmReserve()">ยืนยันการจอง</button>
        </div>
    </div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script src="../js/books.js"></script>
</body>
</html>
