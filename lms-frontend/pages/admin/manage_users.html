<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จัดการสมาชิก</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../../css/style.css" rel="stylesheet">
</head>
<body>
<div id="navbar"></div>
<div class="container">
    <div id="alertBox"></div>
    <h2 class="mb-3">จัดการข้อมูลสมาชิก</h2>
    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-striped table-hover mb-0">
                <thead class="table-dark"><tr><th>ID</th><th>ชื่อ</th><th>อีเมล</th><th>สถานะ</th><th>จัดการ</th></tr></thead>
                <tbody id="rows"></tbody>
            </table>
        </div>
    </div>
    <div class="mt-3"><a href="../dashboard.html" class="btn btn-secondary">⬅️ กลับหน้าหลัก</a></div>
</div>

<div class="modal fade" id="userModal" tabindex="-1">
    <div class="modal-dialog"><div class="modal-content">
        <div class="modal-header"><h5 class="modal-title">แก้ไขข้อมูลสมาชิก</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
            <div class="mb-3"><label>ชื่อ-นามสกุล</label><input id="f_name" class="form-control"></div>
            <div class="mb-3"><label>อีเมล</label><input id="f_email" type="email" class="form-control"></div>
            <div class="mb-3"><label>สถานะ</label><select id="f_role" class="form-select"><option value="user">User (ผู้ใช้ทั่วไป)</option><option value="admin">Admin (ผู้ดูแลระบบ)</option></select></div>
        </div>
        <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">ยกเลิก</button><button class="btn btn-primary" onclick="save()">บันทึก</button></div>
    </div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../js/api.js"></script>
<script>
    let editingId = null, cache = [];
    document.addEventListener('DOMContentLoaded', () => { if (!requireAdmin()) return; renderNavbar(); showFlash(); load(); });
    async function load() {
        const { data } = await apiFetch('/users.php?action=list');
        cache = data.data || [];
        document.getElementById('rows').innerHTML = cache.map(u => `<tr>
    <td>${u.id}</td><td>${escapeHtml(u.name)}</td><td>${escapeHtml(u.email)}</td>
    <td><span class="badge bg-${u.role === 'admin' ? 'danger' : 'primary'}">${escapeHtml(String(u.role).toUpperCase())}</span></td>
    <td><button class="btn btn-sm btn-warning" onclick="openEdit(${u.id})">แก้ไข</button>
        <button class="btn btn-sm btn-danger" onclick="del(${u.id})">ลบ</button></td></tr>`).join('');
    }
    function modal() { return bootstrap.Modal.getOrCreateInstance(document.getElementById('userModal')); }
    function openEdit(id) {
        const u = cache.find(x => x.id == id); if (!u) return;
        editingId = u.id;
        document.getElementById('f_name').value = u.name;
        document.getElementById('f_email').value = u.email;
        document.getElementById('f_role').value = u.role;
        modal().show();
    }
    async function save() {
        const body = { id: editingId, name: document.getElementById('f_name').value.trim(), email: document.getElementById('f_email').value.trim(), role: document.getElementById('f_role').value };
        const { data } = await apiFetch('/users.php?action=update', { method: 'POST', body });
        if (data.success) { modal().hide(); setFlash('success', data.message); location.reload(); }
        else showAlert(data.message || 'บันทึกไม่สำเร็จ', 'danger');
    }
    async function del(id) {
        if (!confirm('ยืนยันลบสมาชิกคนนี้?')) return;
        const { data } = await apiFetch('/users.php?action=delete&id=' + id);
        if (data.success) { setFlash('success', data.message); location.reload(); }
        else showAlert(data.message || 'ลบไม่สำเร็จ', 'danger');
    }
</script>
</body>
</html>
