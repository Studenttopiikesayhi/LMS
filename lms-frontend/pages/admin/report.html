<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายงานสรุป</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../../css/style.css" rel="stylesheet">
</head>
<body>
<div id="navbar"></div>
<div class="container">
    <div class="alert alert-info d-flex justify-content-between align-items-center shadow-sm">
        <h4 class="mb-0">📊 รายงานภาพรวมการเช่า-คืน</h4>
        <h4 class="mb-0">ยอดค่าปรับรวม: <span class="badge bg-danger"><span id="totalFine">0.00</span> บาท</span></h4>
    </div>
    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-bordered table-striped mb-0">
                <thead class="table-dark"><tr><th>สมาชิก</th><th>ชื่อหนังสือ</th><th>วันที่เริ่ม</th><th>กำหนดส่ง</th><th>วันที่คืน</th><th>ค่าปรับ</th><th>สถานะ</th></tr></thead>
                <tbody id="rows"></tbody>
            </table>
        </div>
    </div>
    <div class="mt-3"><a href="../dashboard.html" class="btn btn-secondary">⬅️ กลับหน้าหลัก</a></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../js/api.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => { if (!requireAdmin()) return; renderNavbar(); load(); });
    async function load() {
        const { data } = await apiFetch('/issues.php?action=report');
        document.getElementById('totalFine').textContent = Number(data.total_fine || 0).toFixed(2);
        const tbody = document.getElementById('rows');
        tbody.innerHTML = (data.data || []).length ? data.data.map(r => `<tr>
    <td>${escapeHtml(r.user_name)}</td><td>${escapeHtml(r.title)}</td>
    <td>${fmtDate(r.issue_date)}</td><td>${fmtDate(r.due_date)}</td><td>${r.return_date ? fmtDate(r.return_date) : '-'}</td>
    <td class="text-danger fw-bold">${Number(r.fine).toFixed(2)}</td><td>${statusBadge(r)}</td></tr>`).join('')
            : '<tr><td colspan="7" class="text-center py-3">ไม่มีข้อมูล</td></tr>';
    }
</script>
</body>
</html>
