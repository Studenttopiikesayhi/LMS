<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จัดการหนังสือ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../../css/style.css" rel="stylesheet">
</head>
<body>
<div id="navbar"></div>
<div class="container">
    <div id="alertBox"></div>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0">จัดการข้อมูลหนังสือ</h2>
        <button class="btn btn-success shadow-sm" onclick="openAdd()">+ เพิ่มหนังสือใหม่</button>
    </div>
    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-dark"><tr><th>ID</th><th>ชื่อหนังสือ</th><th>ผู้แต่ง</th><th>หมวดหมู่</th><th>ราคา</th><th>คงเหลือ</th><th>จัดการ</th></tr></thead>
                <tbody id="rows"></tbody>
            </table>
        </div>
    </div>
    <div class="mt-3"><a href="../dashboard.html" class="btn btn-secondary">⬅️ กลับหน้าหลัก</a></div>
</div>

<div class="modal fade" id="bookModal" tabindex="-1">
    <div class="modal-dialog"><div class="modal-content">
        <div class="modal-header"><h5 class="modal-title" id="modalTitle">เพิ่มหนังสือ</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
            <div class="mb-3"><label>ชื่อหนังสือ</label><input id="f_title" class="form-control"></div>
            <div class="mb-3"><label>ผู้เขียน</label><input id="f_author" class="form-control"></div>
            <div class="mb-3"><label>หมวดหมู่</label><input id="f_category" class="form-control"></div>
            <div class="row">
                <div class="col-6 mb-3"><label>ราคา</label><input id="f_price" type="number" step="0.01" class="form-control"></div>
                <div class="col-6 mb-3"><label>จำนวนคงเหลือ</label><input id="f_copies" type="number" class="form-control"></div>
            </div>
        </div>
        <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">ยกเลิก</button><button class="btn btn-primary" onclick="save()">บันทึก</button></div>
    </div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../js/api.js"></script>
<script>
    let editingId = null, cache = [];
    document.addEventListener('DOMContentLoaded', () => { if (!requireAdmin()) return; renderNavbar(); showFlash(); load(); });
    async function load() {
        const { data } = await apiFetch('/books.php?action=list');
        cache = data.data || [];
        const tbody = document.getElementById('rows');
        tbody.innerHTML = cache.length ? cache.map(b => `<tr>
    <td>${b.id}</td><td>${escapeHtml(b.title)}</td><td>${escapeHtml(b.author || '-')}</td>
    <td>${escapeHtml(b.category || '-')}</td><td>${Number(b.price).toFixed(2)}</td><td>${b.copies}</td>
    <td><button class="btn btn-sm btn-warning" onclick="openEdit(${b.id})">แก้ไข</button>
        <button class="btn btn-sm btn-danger" onclick="del(${b.id})">ลบ</button></td></tr>`).join('')
            : '<tr><td colspan="7" class="text-center py-3">ไม่มีข้อมูล</td></tr>';
    }
    function modal() { return bootstrap.Modal.getOrCreateInstance(document.getElementById('bookModal')); }
    function setForm(b) { ['title','author','category','price','copies'].forEach(k => document.getElementById('f_' + k).value = b[k] ?? ''); }
    function openAdd() { editingId = null; setForm({}); document.getElementById('modalTitle').textContent = 'เพิ่มหนังสือ'; modal().show(); }
    function openEdit(id) { const b = cache.find(x => x.id == id); if (!b) return; editingId = b.id; setForm(b); document.getElementById('modalTitle').textContent = 'แก้ไขหนังสือ'; modal().show(); }
    function f(id) { return document.getElementById('f_' + id).value.trim(); }
    async function save() {
        const body = { title: f('title'), author: f('author'), category: f('category'), price: parseFloat(f('price')) || 0, copies: parseInt(f('copies')) || 0 };
        if (!body.title) { showAlert('กรุณากรอกชื่อหนังสือ', 'warning'); return; }
        let res;
        if (editingId) { body.id = editingId; res = await apiFetch('/books.php?action=update', { method: 'POST', body }); }
        else res = await apiFetch('/books.php?action=create', { method: 'POST', body });
        if (res.data.success) { modal().hide(); setFlash('success', res.data.message); location.reload(); }
        else showAlert(res.data.message || 'บันทึกไม่สำเร็จ', 'danger');
    }
    async function del(id) {
        if (!confirm('ยืนยันลบหนังสือเล่มนี้?')) return;
        const { data } = await apiFetch('/books.php?action=delete&id=' + id);
        if (data.success) { setFlash('success', data.message); location.reload(); }
        else showAlert(data.message || 'ลบไม่สำเร็จ', 'danger');
    }
</script>
</body>
</html>
