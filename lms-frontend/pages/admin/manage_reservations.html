<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จัดการการจอง</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../../css/style.css" rel="stylesheet">
</head>
<body>
<div id="navbar"></div>
<div class="container">
    <div id="alertBox"></div>
    <h3 class="mb-3">✅ จัดการรายการจอง (Pickup)</h3>
    <div class="alert alert-warning shadow-sm"><strong>คำแนะนำ:</strong> กด "รับของ" เมื่อลูกค้ามาชำระเงินและรับหนังสือจริงเท่านั้น</div>
    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-bordered mb-0">
                <thead class="table-dark"><tr><th>ID</th><th>ผู้จอง</th><th>หนังสือ</th><th>วันที่จอง</th><th>จัดการ</th></tr></thead>
                <tbody id="rows"></tbody>
            </table>
        </div>
    </div>
    <div class="mt-3"><a href="../dashboard.html" class="btn btn-secondary">⬅️ กลับหน้าหลัก</a></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../js/api.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => { if (!requireAdmin()) return; renderNavbar(); showFlash(); load(); });
    async function load() {
        const { data } = await apiFetch('/issues.php?action=reservations');
        const tbody = document.getElementById('rows');
        if (!data.success || !data.data.length) { tbody.innerHTML = '<tr><td colspan="5" class="text-center py-3">ไม่มีรายการจองค้างอยู่</td></tr>'; return; }
        tbody.innerHTML = data.data.map(r => `<tr>
    <td>${r.id}</td><td>${escapeHtml(r.user_name)}</td><td>${escapeHtml(r.title)}</td><td>${fmtDate(r.issue_date)}</td>
    <td><button class="btn btn-sm btn-success" onclick="act(${r.id},'approve')">✅ รับของ</button>
        <button class="btn btn-sm btn-danger" onclick="act(${r.id},'cancel')">❌ ยกเลิก</button></td></tr>`).join('');
    }
    async function act(id, action) {
        if (!confirm(action === 'approve' ? 'ยืนยันลูกค้ามารับของแล้ว?' : 'ยกเลิกและคืนสต็อกกลับร้าน?')) return;
        const { data } = await apiFetch('/issues.php?action=' + action, { method: 'POST', body: { id } });
        if (data.success) { setFlash('success', data.message); location.reload(); }
        else showAlert(data.message || 'ทำรายการไม่สำเร็จ', 'danger');
    }
</script>
</body>
</html>
