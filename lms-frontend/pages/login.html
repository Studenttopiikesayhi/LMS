<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - ร้านเช่าหนังสือ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
</head>
<body>
<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-5">
            <div id="alertBox"></div>
            <div class="card shadow">
                <div class="card-header bg-primary text-white text-center py-3"><h4 class="mb-0">เข้าสู่ระบบร้านเช่าหนังสือ</h4></div>
                <div class="card-body p-4">
                    <div class="mb-3"><label class="form-label">อีเมล</label><input type="email" id="email" class="form-control"></div>
                    <div class="mb-3"><label class="form-label">รหัสผ่าน</label><input type="password" id="password" class="form-control"></div>
                    <button class="btn btn-primary w-100" onclick="doLogin()">เข้าสู่ระบบ</button>
                    <div class="mt-4 text-center">
                        <a href="search_book.html" class="btn btn-outline-info w-100 mb-2">🔍 ค้นหาหนังสือ (บุคคลทั่วไป)</a>
                        <a href="register.html" class="btn btn-outline-secondary w-100">สมัครสมาชิกใหม่</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script>
    showFlash();
    document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
